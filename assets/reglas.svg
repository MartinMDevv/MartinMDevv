<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="210" viewBox="0 0 1000 210" role="img" aria-label="Cómo trabajo: si no se levanta con un comando, no está terminado; si lo hago dos veces, lo automatizo; ningún secreto toca el repo; construyo, despliego y después ataco"><style>
.m{font-family:'JetBrains Mono','Fira Code','Cascadia Code',Consolas,'DejaVu Sans Mono',monospace;font-size:17px;fill:#d6d6dc}
.r{fill:#ff2e4d} .g{fill:#5c5c66} .b{font-weight:700} .w{fill:#f2f2f4} .s{font-size:14px}
.l{opacity:0;animation:ap .6s ease forwards}
@keyframes ap{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
.cur{animation:pa 1s step-end infinite} @keyframes pa{50%{opacity:0}}
</style><rect x="1" y="1" width="998" height="208" rx="12" fill="#0b0b0e" stroke="#2a2a30" stroke-width="2"/><text class="m" x="28" y="38"><tspan class="g">┌─[</tspan><tspan class="r">martin</tspan><tspan class="g">@</tspan>arch<tspan class="g">]─[~]</tspan></text><text class="m" x="28" y="62"><tspan class="g">└──╼</tspan> <tspan class="r">$</tspan> cat reglas.txt</text><text class="m l" style="animation-delay:0.30s" x="28" y="100"><tspan class="r b">▸</tspan> si no se levanta con un comando, no está terminado</text><text class="m l" style="animation-delay:0.75s" x="28" y="126"><tspan class="r b">▸</tspan> si lo hago dos veces, lo automatizo</text><text class="m l" style="animation-delay:1.20s" x="28" y="152"><tspan class="r b">▸</tspan> ningún secreto toca el repo</text><text class="m l" style="animation-delay:1.65s" x="28" y="178"><tspan class="r b">▸</tspan> construyo, despliego y después ataco</text><rect class="cur r" x="422" y="164" width="10" height="18"/></svg>