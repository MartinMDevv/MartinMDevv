.cur{animation:pa 1s step-end infinite} @keyframes pa{50%{opacity:0}}
</style><style>.n{font-family:"Segoe UI",Ubuntu,"Helvetica Neue",Arial,sans-serif;font-size:16px;fill:#d6d6dc}.h{font-family:"Segoe UI",Ubuntu,Arial,sans-serif;font-size:19px;font-weight:700;fill:#f2f2f4}.c{font-family:"JetBrains Mono",Consolas,monospace;font-size:12px;fill:#ff2e4d;letter-spacing:1px}</style><text class="c" x="2" y="18" style="font-size:15px;letter-spacing:5px;font-weight:700">CERTIPROF</text><text class="n" x="148" y="18" style="font-size:14px;fill:#5c5c66">· 9 certificaciones internacionales</text><g class="l" style="animation-delay:0.20s"><rect x="1" y="50" width="386" height="268" rx="12" fill="#0b0b0e" stroke="#2a2a30" stroke-width="2"/><rect x="1" y="50" width="386" height="4" rx="2" fill="#ff2e4d"/><g transform="translate(38 95)"><circle r="17" fill="#ff2e4d" fill-opacity=".12"/><path d="M0 -9 L8 -6 V1 C8 6 4 9 0 11 C-4 9 -8 6 -8 1 V-6 Z" fill="none" stroke="#ff2e4d" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></g><text class="h" x="66" y="102">Ciberseguridad</text><text class="c" x="24" y="153">CEHPC</text><text class="n" x="24" y="173">Ethical Hacking</text><text class="c" x="24" y="195">LCSPC</text><text class="n" x="24" y="215">Lead Cybersecurity Professional</text><text class="c" x="24" y="237">CSFPC</text><text class="n" x="24" y="257">Cybersecurity Foundation</text><text class="c" x="24" y="279">CAPC</text><text class="n" x="24" y="299">Cybersecurity Awareness</text></g><g class="l" style="animation-delay:0.35s"><rect x="401" y="50" width="286" height="268" rx="12" fill="#0b0b0e" stroke="#2a2a30" stroke-width="2"/><rect x="401" y="50" width="286" height="4" rx="2" fill="#ff2e4d"/><g transform="translate(438 95)"><circle r="17" fill="#ff2e4d" fill-opacity=".12"/><path d="M-9 0 C-9 -5 -5 -5 0 0 C5 5 9 5 9 0 C9 -5 5 -5 0 0 C-5 5 -9 5 -9 0 Z" fill="none" stroke="#ff2e4d" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></g><text class="h" x="466" y="102">DevOps</text><text class="c" x="424" y="153">DAPC